[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-transcription-studio"
version = "0.2.0"
description = "Local-first MP4 transcription and review utility"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "openai-whisper==20240930",
    "pydantic==2.13.4",
    "python-multipart==0.0.20",
    "uvicorn==0.49.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.27.2",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.11.13",
]

[project.scripts]
secure-transcription-studio = "secure_transcribe.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secure_transcribe = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
